[package]
name = "ferrifirm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SimoesCTT/ferrifirm"

[dependencies]
ferrifirm-allocator = { path = "allocator" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = false
codegen-units = 1

[workspace]
members = ["allocator"]
resolver = "2"
